<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CivXpert — Sign in</title><style>:root{--bg:#07111f;--panel:#0d1b2d;--line:#1c3550;--text:#edf6ff;--muted:#8ea4ba;--accent:#35d0ba;--blue:#5ea7ff;--danger:#ff6b7a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#173a52 0,transparent 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(420px,calc(100% - 34px))}.brand{text-align:center;margin-bottom:25px}.logo{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--blue));color:#04111c;font-weight:900;display:grid;place-items:center;margin:0 auto 12px}.brand h1{margin:0;font-size:24px}.brand p{margin:6px 0;color:var(--muted);font-size:12px}.card{background:rgba(13,27,45,.95);border:1px solid var(--line);border-radius:17px;padding:25px;box-shadow:0 20px 70px rgba(0,0,0,.25)}h2{margin:0 0 6px;font-size:17px}.sub{color:var(--muted);font-size:12px;margin:0 0 20px}label{display:block;color:#9db1c5;font-size:11px;margin:0 0 6px}input{width:100%;padding:11px 12px;margin-bottom:14px;border-radius:10px;background:#081624;color:var(--text);border:1px solid var(--line);outline:none;font:inherit}input:focus{border-color:#3979a8}button{width:100%;border:0;border-radius:10px;padding:11px;background:linear-gradient(135deg,var(--accent),#31a8e9);font-weight:800;color:#04111c;cursor:pointer}.error{background:#321923;border:1px solid #6e2c3a;color:#ffadb7;border-radius:9px;padding:10px;font-size:12px;margin-bottom:15px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}.footer a{color:var(--accent);text-decoration:none}.security{display:flex;gap:7px;align-items:center;color:#617991;font-size:10px;margin-top:17px;justify-content:center}</style></head><body><main class="wrap"><div class="brand"><div class="logo">CX</div><h1>CivXpert</h1><p>AI-powered civic grievance intelligence</p></div><section class="card"><h2>Welcome back</h2><p class="sub">Sign in to submit and track civic complaints.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST"><label>USERNAME</label><input name="username" type="text" autocomplete="username" required><label>PASSWORD</label><input name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in →</button></form><div class="security">● Secure session • Role-based access</div></section><div class="footer">New to CivXpert? <a href="/register">Create an account</a></div></main></body></html>
